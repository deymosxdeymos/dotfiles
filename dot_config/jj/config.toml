[user]
name = "deymosxdeymos"
email = "galinnichola15@gmail.com"

[aliases]
".." = ["edit", "@-"]
",," = ["edit", "@+"]

fetch = ["git", "fetch"]
f = ["git", "fetch"]

push = ["git", "push"]
p = ["git", "push"]

clone = ["git", "clone"]
cl = ["git", "clone"]

init = ["git", "init"]
i = ["git", "init"]

a = ["abandon"]

c = ["commit"]
ci = ["commit", "--interactive"]

d = ["diff"]

e = ["edit"]

l = ["log"]
la = ["log", "--revisions", "::"]
ls = ["log", "--summary"]
lsa = ["log", "--summary", "--revisions", "::"]
lp = ["log", "--patch"]
lpa = ["log", "--patch", "--revisions", "::"]

r = ["rebase"]

res = ["resolve"]

resolve-ast = ["resolve", "--tool", "mergiraf"]
resa = ["resolve-ast"]

s = ["squash"]
si = ["squash", "--interactive"]

sh = ["show"]

tug = ["bookmark", "move", "--from", "closest(@-)", "--to", "closest_pushable(@)"]
t = ["tug"]

u = ["undo"]

[revset-aliases]
"closest(to)" = "heads(::to & bookmarks())"
"closest_pushable(to)" = "heads(::to & ~description(exact:\"\") & (~empty() | merges()))"

[revsets]
log = "present(@) | present(trunk()) | ancestors(remote_bookmarks().. | @.., 8)"

[ui]
default-command = "ls"
diff-editor = ":builtin"
diff-formatter = ["difft", "--color", "always", "$left", "$right"]
conflict-marker-style = "snapshot"

[ui.graph]
style = "curved"

[templates]
draft_commit_description = '''
concat(
  coalesce(description, "\n"),
  surround(
    "\nJJ: This commit contains the following changes:\n", "",
    indent("JJ:     ", diff.stat(72)),
  ),
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''

[git]
fetch = ["origin", "upstream"]
push = "origin"
